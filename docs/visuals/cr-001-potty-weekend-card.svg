<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 530" role="img" aria-labelledby="title desc">
<title id="title">CR-001 — Proposed Potty Weekend portfolio case-study card</title>
<desc id="desc">Conceptual portfolio project card for Potty Weekend with a small illustrative mobile timer, concise evidence-led project description, privacy labels and links to the public deployed app and source. This is not a screenshot of the running application and the proposed card is not yet implemented.</desc>
<rect width="1140" height="530" fill="#eee5d1"/>
<rect x="22" y="20" width="1096" height="490" rx="24" fill="#0e3035" stroke="#44645d" stroke-width="2"/>
<text x="58" y="65" fill="#edb591" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2">CR-001 / ILL-05 • CASE STUDY CONCEPT</text>
<rect x="835" y="41" width="236" height="35" rx="17" fill="#28544e"/>
<text x="953" y="64" fill="#e6f4e5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">DEPLOYED · PHONE QA PENDING</text>
<text x="57" y="137" fill="#fff6e5" font-family="Georgia, serif" font-size="49" font-weight="bold">Potty Weekend</text>
<text x="58" y="181" fill="#c3d1cb" font-family="Arial, sans-serif" font-size="19">A small, privacy-conscious tool for a real family need.</text>
<text x="58" y="227" fill="#f2dfc7" font-family="Arial, sans-serif" font-size="18">Adjustable reminders, quick logging, optional photos and</text>
<text x="58" y="255" fill="#f2dfc7" font-family="Arial, sans-serif" font-size="18">opt-in experimental suggestions — designed to stay calm,</text>
<text x="58" y="283" fill="#f2dfc7" font-family="Arial, sans-serif" font-size="18">local-first and usable in the middle of a busy day.</text>
<g font-family="ui-monospace, monospace" font-size="14" fill="#f4e7d6" text-anchor="middle">
 <rect x="57" y="317" width="129" height="36" rx="8" fill="#2a5454"/><text x="122" y="340">JavaScript</text>
 <rect x="197" y="317" width="120" height="36" rx="8" fill="#2a5454"/><text x="257" y="340">IndexedDB</text>
 <rect x="328" y="317" width="106" height="36" rx="8" fill="#2a5454"/><text x="381" y="340">Testing</text>
 <rect x="445" y="317" width="105" height="36" rx="8" fill="#2a5454"/><text x="497" y="340">Netlify</text>
</g>
<text x="58" y="405" fill="#f7d5ad" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Case study ↗    Live app ↗    Public source ↗</text>
<line x1="58" y1="424" x2="570" y2="424" stroke="#456764"/>
<text x="58" y="454" fill="#bad0c8" font-family="Arial, sans-serif" font-size="13">No child photos, personal logs or unverified training claims.</text>
