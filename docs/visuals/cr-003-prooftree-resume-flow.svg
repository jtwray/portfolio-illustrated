<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" role="img" aria-labelledby="title desc">
<title id="title">CR-003 — ProofTree evidence-verified résumé workflow</title>
<desc id="desc">Future owner-only flow: Upload a job description; authenticate and query ProofTree, which can reference employment, GitHub and permission-approved ChatGPT/Codex evidence; map each job requirement to evidence; let the owner review and approve each claim; export a tailored PDF and DOCX. This is a proposal and neither the application nor ProofTree API is verified implemented.</desc>
