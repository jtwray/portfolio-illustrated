<rect x="25" y="22" width="1310" height="596" rx="25" fill="#0e3035" stroke="#44645d" stroke-width="2"/>
<rect x="54" y="49" width="7" height="61" rx="3" fill="#edb591"/>
<text x="80" y="65" fill="#edb591" font-size="15" font-family="ui-monospace, monospace" letter-spacing="2">CR-003 / ILL-07 • FUTURE CONCEPT</text>
<text x="80" y="110" fill="#fff6e5" font-size="38" font-weight="bold" font-family="Georgia, serif">Job description → evidence → honest résumé</text>
<rect x="1114" y="51" width="186" height="32" rx="16" fill="#244e50"/>
<text x="1207" y="72" font-size="12" fill="#f6e8d4" text-anchor="middle" font-family="Arial, sans-serif">OWNER-ONLY ACCESS</text>
<text x="56" y="155" fill="#c1d0c7" font-size="17" font-family="Arial, sans-serif">Every significant claim remains traceable to its source and passes human review before export.</text>
